{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Samaan AI{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'task_management/css/task_management_style.css' %}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- jQuery UI CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    {% block additional_head %} {% endblock %}

</head>
<body>
    <header class="sticky-top">
        <div class="container-fluid py-2 bg-white border-bottom">
            <div class="d-flex align-items-center">
                <!-- Logo removed -->
                <div class="flex-grow-1">
                    {% include 'core/header.html' %}
                </div>
            </div>
        </div>
    </header>

    {% block content %}
    <!-- This block will be overridden by child templates -->
    {% endblock %}

    <!-- Correct Script Loading Order -->
    <!-- 1. jQuery (loaded only once) -->
    <script src="https://code.jquery.com/jquery-3.7.0.js" integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM=" crossorigin="anonymous"></script>
    <!-- 2. jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <!-- 3. Bootstrap Bundle with Popper (Updated to 5.1.3) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>   
    
    <!-- 4. CSRF Setup Script (depends on jQuery) -->
    <script>
      // Function to get the value of a specified cookie by its name
      function getCookie(name) {
          let cookieValue = null;
          if (document.cookie && document.cookie !== '') {
              const cookies = document.cookie.split(';');
              for (let i = 0; i < cookies.length; i++) {
                  // Use jQuery.trim() which is now guaranteed to be loaded
                  const cookie = jQuery.trim(cookies[i]); 
                  // Check if this cookie's name matches the specified name
                  if (cookie.substring(0, name.length + 1) === (name + '=')) {
                      cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                      break;
                  }
              }
          }
          return cookieValue;
      }

      // Retrieve the CSRF token from the cookies
      const csrftoken = getCookie('csrftoken');

      // Setup jQuery AJAX to include the CSRF token in the request headers
      // Ensure jQuery is loaded before this runs
      if (window.jQuery) {
          $.ajaxSetup({
              beforeSend: function(xhr, settings) {
                  // If the request type is not GET, HEAD, OPTIONS, or TRACE, and it's not cross-domain
                  if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) && !this.crossDomain) {
                      // Set the CSRF token in the request header
                      xhr.setRequestHeader("X-CSRFToken", csrftoken);
                  }
              }
          });
      } else {
          console.error("jQuery not loaded before CSRF setup script!");
      }
  </script>

    <!-- 5. Child Template Script Block -->
    {% block script_block %}{% endblock %}

</body>
</html>
