<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Background Element -->
  <circle cx="25" cy="25" r="20" fill="url(#logoGradient)" filter="url(#shadowEffect)" />
  
  <!-- Checkmark inside circle -->
  <path d="M16,25 L22,31 L34,19" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- SamaanAI Text -->
  <text x="55" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#2563EB">
    Samaan<tspan fill="#4F46E5">AI</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="55" y="44" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#6B7280">
    Intelligent Task Management
  </text>
</svg> 